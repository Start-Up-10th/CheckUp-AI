openapi: 3.1.0
info:
  title: Dormitory Face Inference Service
  version: 0.1.0
paths:
  /health/live:
    get:
      responses: {"200": {description: live}}
  /health/ready:
    get:
      responses:
        "200": {description: model and calibration ready}
        "503": {description: model or calibration unavailable}
  /api/v1/face/registration:
    post:
      security: [{accessBearer: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: "#/components/schemas/FaceImagesRequest"}
      responses:
        "201":
          description: face registration succeeded
          content: {application/json: {schema: {$ref: "#/components/schemas/FaceRegistrationResponse"}}}
        "400": {description: malformed request or invalid image}
        "401": {description: missing or invalid access token}
        "403": {description: student information was not found}
        "409": {description: face data is already registered}
        "422": {description: no face detected or insufficient face data}
        "500": {description: internal server error}
  /api/v1/face/detect:
    get:
      description: Multipart GET is retained for compatibility with the existing backend contract.
      security: [{accessBearer: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: {$ref: "#/components/schemas/FaceImagesRequest"}
      responses:
        "201":
          description: face detection result
          content: {application/json: {schema: {$ref: "#/components/schemas/PublicFaceDetectResponse"}}}
        "400": {description: malformed request or invalid image}
        "401": {description: missing or invalid access token}
        "403": {description: student information was not found}
        "422": {description: no face detected or insufficient face data}
        "500": {description: internal server error}
  /internal/v1/face/enrollments/extract:
    post:
      security: [{serviceBearer: []}]
      requestBody:
        required: true
        content:
          video/webm: {schema: {type: string, format: binary}}
          video/mp4: {schema: {type: string, format: binary}}
      responses:
        "200":
          description: 100 sampled frames reviewed and 20 representative vectors returned
          content: {application/json: {schema: {$ref: "#/components/schemas/EnrollmentResponse"}}}
        "422": {description: quality or identity consistency failure}
  /internal/v1/face/sessions/{session_id}/frames:
    post:
      security: [{serviceBearer: []}]
      parameters:
        - {name: session_id, in: path, required: true, schema: {type: string}}
        - {name: X-Frame-Id, in: header, required: false, schema: {type: string}}
      requestBody:
        required: true
        content:
          image/jpeg: {schema: {type: string, format: binary}}
          image/webp: {schema: {type: string, format: binary}}
      responses:
        "200":
          description: one result per detected face; attendance is not mutated
          content: {application/json: {schema: {$ref: "#/components/schemas/FrameResponse"}}}
components:
  securitySchemes:
    serviceBearer: {type: http, scheme: bearer}
    accessBearer: {type: http, scheme: bearer}
  schemas:
    FaceImagesRequest:
      type: object
      required: [images]
      properties:
        images:
          type: array
          minItems: 1
          items: {type: string, format: binary}
    FaceRegistrationResponse:
      type: object
      required: [success]
      properties:
        success: {type: boolean}
    PublicFaceDetectResponse:
      type: object
      required: [student_id, success]
      properties:
        student_id: {type: [integer, "null"]}
        success: {type: boolean}
    VectorModel:
      type: object
      required: [model_id, version, dimension, normalization]
      properties:
        model_id: {type: string}
        version: {type: string}
        dimension: {type: integer, const: 256}
        normalization: {type: string, enum: [l2]}
    EnrollmentResponse:
      type: object
      required: [model, reviewedFrames, acceptedFrames, vectors]
      properties:
        model: {$ref: "#/components/schemas/VectorModel"}
        reviewedFrames: {type: integer, maximum: 100}
        acceptedFrames: {type: integer}
        vectors:
          type: array
          minItems: 20
          maxItems: 20
          items: {type: array, minItems: 256, maxItems: 256, items: {type: number}}
    FrameResponse:
      type: object
      required: [frameId, faces]
      properties:
        frameId: {type: string}
        faces:
          type: array
          items: {$ref: "#/components/schemas/FaceResult"}
    FaceResult:
      type: object
      required: [trackId, bbox, landmarks, quality, recognition, attempts, qrRecommended]
      properties:
        trackId: {type: string}
        bbox: {type: array, minItems: 4, maxItems: 4, items: {type: number}}
        landmarks: {type: array, items: {type: array, minItems: 2, maxItems: 2, items: {type: number}}}
        quality: {type: object}
        recognition:
          type: object
          required: [status, studentId, score, margin]
          properties:
            status: {type: string, enum: [KNOWN, UNKNOWN, NOT_ATTEMPTED]}
            studentId: {type: [string, "null"]}
            score: {type: [number, "null"]}
            margin: {type: [number, "null"]}
        attempts: {type: integer}
        qrRecommended: {type: boolean}
